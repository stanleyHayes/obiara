name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify peer dependencies
        run: pnpm peers check

      - name: Check all workspaces
        run: pnpm run check

      - name: Check localization, accessibility, and copy policies
        run: pnpm run check:client-quality

      - name: Vet Go packages
        run: go vet ./...

      - name: Build all clients
        run: pnpm run build

      - name: Install visual-test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run accessibility and visual-regression gate
        run: pnpm run check:visual

      - name: Upload visual-test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-test-report
          path: playwright-report/
          retention-days: 14

      - name: Verify clean generated state
        run: git diff --exit-code
