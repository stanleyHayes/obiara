                helpline_directory_gh,
                counselor_referral,
                support_content,
                closure_quietening,
              ]
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
    AdminCareCaseEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AdminCareCaseData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminCareCaseListData:
      type: object
      additionalProperties: false
      required: [cases]
      properties:
        cases:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminCareCaseData"
    AdminCareCaseListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AdminCareCaseListData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminCareResolutionInput:
      type: object
      additionalProperties: false
      required: [scripts]
      properties:
        scripts:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
              [
                helpline_directory_gh,
                counselor_referral,
                support_content,
                closure_quietening,
              ]
    AdminRuntimeControlData:
      type: object
      additionalProperties: false
      required:
        [
          proposalId,
          capability,
          environment,
          market,
          action,
          reason,
          status,
          version,
          expiresAt,
          proposedByMe,
          approvedByMe,
        ]
      properties:
        proposalId:
          type: string
        capability:
          type: string
          enum: [sow, fires, ai, payments, gate]
        environment:
          type: string
          enum: [staging, production]
        market:
          type: string
          enum: [GH]
        action:
          type: string
          enum: [enable, disable, kill, unkill]
        reason:
          type: string
          enum: [staged_rollout, incident, maintenance]
        status:
          type: string
          enum: [proposed, approved, applied, expired]
        version:
          type: integer
          format: int64
          minimum: 1
        expiresAt:
          type: string
          format: date-time
        proposedByMe:
          type: boolean
        approvedByMe:
          type: boolean
    AdminRuntimeControlEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AdminRuntimeControlData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminRuntimeControlListData:
