openapi: 3.1.0
info:
  title: Obiara API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Authoritative REST contract for Obiara member clients. Durable API changes
    are additive within v1. Retriable writes require an Idempotency-Key.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: API root
tags:
  - name: Health
    description: Process and required-dependency health probes.
  - name: Members
    description: Member account commands and resources.
  - name: Trust
    description: Owner-bound, privacy-filtered and bounded trust explanations.
  - name: Admin Verification
    description: Least-privilege human verification desk operations.
paths:
  /live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Report process liveness
      security: []
      responses:
        "200":
          description: The API process is alive.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/plain:
              schema:
                type: string
                const: ok
        "405":
          description: The HTTP method is not supported for this route.
  /ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Report required-dependency readiness
      security: []
      responses:
        "200":
          description: Required dependencies are available.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/plain:
              schema:
                type: string
                const: ok
        "503":
          description: A required dependency is unavailable.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/plain:
              schema:
                type: string
                const: dependency unavailable
        "405":
          description: The HTTP method is not supported for this route.
  /v1/members:
    post:
      operationId: registerMember
      tags: [Members]
      summary: Register the baseline member record
      security: []
      description: |
        Creates the baseline member record through the member application
        boundary. Repeated delivery must use the same Idempotency-Key.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMemberRequest"
      responses:
        "201":
          description: Member registered.
          headers:
            Location:
              description: Relative URL of the created member.
              schema:
                type: string
                pattern: ^/v1/members/
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/MemberConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/otp:
    post:
      operationId: requestOtp
      tags: [Auth]
      summary: Request a phone OTP challenge
      security: []
      description: |
        Issues a 6-digit code to the phone via the active OTP provider
        (SMS with WhatsApp fallback). Subject to per-phone resend
        throttling. The response never contains the code.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "202":
          description: Code sent (or silently accepted for unknown numbers).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/OtpRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Verify a phone OTP and issue a session
      security: []
      description: |
        Verifies the latest challenge for the phone, finds or creates the
        account (exactly one active account per phone) and issues a
        short-lived access token plus a rotated refresh token.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Session issued.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/OtpInvalid"
        "403":
          $ref: "#/components/responses/AccountNotActive"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/OtpRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/verifications/ghana-card:
    post:
      operationId: submitGhanaCard
      tags: [Verification]
      summary: Submit a Ghana Card for identity verification
      security: []
      description: |
        Opens a verification case and asks the issuer provider. Approved
        submissions promote the account to Tier 1. Provider outage or
        uncertainty routes the case to the human fallback queue (202) —
        never a silent pass. Rejections return 422 verification_rejected.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GhanaCardInput"
      responses:
        "201":
          description: Verification decided (approved).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCaseEnvelope"
        "202":
          description: Case routed to the human fallback queue.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCaseEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/VerificationRejected"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/privacy/exports:
    post:
      operationId: requestExport
      tags: [Privacy]
      summary: Request a data export
      security: []
      description: |
        Opens an export request. The machine-readable archive is delivered
        within 72 hours (FR-106). One open request per kind per account.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestInput"
      responses:
        "201":
          description: Export request opened.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/PrivacyRequestExists"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/privacy/deletions:
    post:
      operationId: requestDeletion
      tags: [Privacy]
      summary: Request account deletion
      security: []
      description: |
        Opens a deletion request completed within 30 days with
        cryptographic erasure of voice/biometric blobs (FR-106). Active
        legal holds block deletion with 409 legal_hold_active.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestInput"
      responses:
        "201":
          description: Deletion request opened.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/PrivacyRequestExists"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/privacy/requests/{id}:
    get:
      operationId: privacyRequestStatus
      tags: [Privacy]
      summary: Read a privacy request status
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request status.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestEnvelope"
        "404":
          $ref: "#/components/responses/PrivacyRequestNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/members/{memberId}/trust-paths:
    get:
      operationId: getMemberTrustPaths
      tags: [Trust]
      summary: Read the authenticated member's visible trust paths
      description: |
        Returns only forward paths whose current edges, consent and endpoints
        remain visible to the authenticated owner. Authentication, owner
        mismatch, hidden resources and policy denial all return the same 404
        response. This contract exposes no global or reverse graph operation.
      security:
        - MemberBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        - name: depth
          in: query
          required: false
          description: Maximum forward traversal depth.
          schema:
            type: integer
            minimum: 1
            maximum: 4
            default: 3
        - name: nodes
          in: query
          required: false
          description: Maximum number of visited nodes, including the owner.
          schema:
            type: integer
            minimum: 2
            maximum: 100
            default: 50
      responses:
        "200":
          description: Privacy-filtered trust explanations, possibly empty.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustPathsEnvelope"
        "400":
          $ref: "#/components/responses/InvalidTrustPathBounds"
        "404":
          $ref: "#/components/responses/TrustPathsNotFound"
  /v1/admin/verifications:
    get:
      operationId: listAdminVerificationQueue
      tags: [Admin Verification]
      summary: List privacy-redacted verification cases
      description: Requires the verification.queue.read capability.
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Oldest queued verification cases, without raw evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerificationQueueEnvelope"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/verifications/{id}:
    get:
      operationId: getAdminVerificationCase
      tags: [Admin Verification]
      summary: Read privacy-redacted verification case detail
      description: Requires the verification.queue.read capability.
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redacted case detail; raw card and birth date are excluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerificationCaseEnvelope"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/VerificationCaseNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/verifications/{id}/evidence-access:
    post:
      operationId: accessAdminVerificationEvidence
      tags: [Admin Verification]
      summary: Access bounded verification evidence and create an audit event
      description: |
        Requires verification.evidence.read, recent MFA, a bounded purpose,
        and a reason. Every successful access writes a dedicated audit event.
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceAccessInput"
      responses:
        "200":
          description: Bounded evidence returned after the audit write succeeds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationEvidenceEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/VerificationCaseNotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/verifications/{id}/decisions:
    post:
      operationId: decideAdminVerificationCase
      tags: [Admin Verification]
      summary: Approve or reject a queued verification case
      description: |
        Requires verification.review. The reason, expected version, and
        Idempotency-Key make retries deterministic and stale writes fail closed.
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationDecisionInput"
      responses:
        "200":
          description: Decision committed or an identical command replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDecisionEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/VerificationCaseNotFound"
        "409":
          $ref: "#/components/responses/VerificationCaseConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: Short-lived member access token; the session subject must match memberId.
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff token carrying the explicitly documented capability and recent-MFA claim where required.
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Safe caller-provided identifier; invalid values are replaced.
      schema:
        $ref: "#/components/schemas/CorrelationId"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key reused for retries of the same command.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
  headers:
    CorrelationId:
      required: true
      description: Effective request correlation identifier.
      schema:
        $ref: "#/components/schemas/CorrelationId"
  responses:
    InvalidJSON:
      description: The body is malformed, oversized, contains unknown fields, or contains multiple values.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalidJSON:
              value:
                error:
                  code: invalid_json
                  message: The request body must be one valid JSON object.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    UnsupportedMediaType:
      description: Content-Type is not application/json.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MemberConflict:
      description: A member with the same identifier already exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            memberConflict:
              value:
                error:
                  code: member_conflict
                  message: A member with this identifier already exists.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    OtpRateLimited:
      description: Too many OTP requests for this phone number.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            otpRateLimited:
              value:
                error:
                  code: otp_rate_limited
                  message: Too many code requests. Please wait and try again.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    OtpInvalid:
      description: The code is invalid, expired, consumed, or attempts are exhausted.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            otpInvalid:
              value:
                error:
                  code: otp_invalid
                  message: The code is not valid for this number.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    AccountNotActive:
      description: The account is blocked or deleted.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            accountNotActive:
              value:
                error:
                  code: account_not_active
                  message: This account is not active.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    VerificationRejected:
      description: The issuer provider rejected the document.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            verificationRejected:
              value:
                error:
                  code: verification_rejected
                  message: The document could not be verified with the issuer.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    PrivacyRequestExists:
      description: An open request of this kind already exists for the account.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            privacyRequestExists:
              value:
                error:
                  code: privacy_request_exists
                  message: An open request of this kind already exists.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    PrivacyRequestNotFound:
      description: No privacy request with this identifier exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            privacyRequestNotFound:
              value:
                error:
                  code: privacy_request_not_found
                  message: No such privacy request.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    InvalidTrustPathBounds:
      description: Trust path depth or node limits are outside the bounded contract.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalidBounds:
              value:
                error:
                  code: invalid_trust_path_bounds
                  message: Trust path limits are invalid.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    TrustPathsNotFound:
      description: |
        Trust paths are unavailable. This deliberately covers invalid
        authentication, owner mismatch, policy denial and hidden resources.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            notFound:
              value:
                error:
                  code: trust_paths_not_found
                  message: Trust paths are not available.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    AdminForbidden:
      description: The staff principal lacks the exact capability, or recent MFA where evidence access requires it.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    VerificationCaseNotFound:
      description: No verification case with this identifier exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    VerificationCaseConflict:
      description: The case is closed, stale, or the idempotency key belongs to another decision.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: Request fields or the idempotency key are invalid.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalidEmail:
              value:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  details:
                    - field: email
                      reason: must be a valid email address
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    InternalError:
      description: An unexpected server failure occurred.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: The application capability is temporarily unavailable.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    CorrelationId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    RegisterMemberRequest:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        email:
          type: string
          format: email
          maxLength: 254
    Member:
      type: object
      additionalProperties: false
      required: [id, email, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    Metadata:
      type: object
      additionalProperties: false
      required: [correlationId]
      properties:
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
    MemberEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Member"
        meta:
          $ref: "#/components/schemas/Metadata"
    PhoneNumber:
      type: string
      pattern: ^\+[1-9]\d{7,14}$
      description: E.164 phone number.
    OtpRequestInput:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          $ref: "#/components/schemas/PhoneNumber"
    OtpRequestData:
      type: object
      additionalProperties: false
      required: [challengeId, expiresAt]
      properties:
        challengeId:
          type: string
        expiresAt:
          type: string
          format: date-time
    OtpRequestEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/OtpRequestData"
        meta:
          $ref: "#/components/schemas/Metadata"
    OtpVerifyInput:
      type: object
      additionalProperties: false
      required: [phone, code, deviceId]
      properties:
        phone:
          $ref: "#/components/schemas/PhoneNumber"
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    SessionData:
      type: object
      additionalProperties: false
      required:
        [
          sessionId,
          memberId,
          accessToken,
          accessExpiresAt,
          refreshToken,
          refreshExpiresAt,
        ]
      properties:
        sessionId:
          type: string
        memberId:
          type: string
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
    SessionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/SessionData"
        meta:
          $ref: "#/components/schemas/Metadata"
    GhanaCardInput:
      type: object
      additionalProperties: false
      required: [accountId, cardNumber, dateOfBirth]
      properties:
        accountId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        cardNumber:
          type: string
          minLength: 1
          maxLength: 32
        dateOfBirth:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Date of birth as YYYY-MM-DD.
    VerificationCaseData:
      type: object
      additionalProperties: false
      required: [caseId, status]
      properties:
        caseId:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, queued_manual]
    VerificationCaseEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/VerificationCaseData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminVerificationCaseData:
      type: object
      additionalProperties: false
      required: [caseId, subjectRef, reasonCode, submittedAt, version]
      properties:
        caseId:
          type: string
        subjectRef:
          type: string
          description: Stable pseudonymous subject reference; never the account identifier.
        reasonCode:
          type: string
          enum: [provider_outage, provider_uncertain, manual_review]
        submittedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [queued_manual, approved, rejected]
        version:
          type: integer
          format: int64
          minimum: 1
    AdminVerificationCaseEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AdminVerificationCaseData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminVerificationQueueData:
      type: object
      additionalProperties: false
      required: [cases]
      properties:
        cases:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminVerificationCaseData"
    AdminVerificationQueueEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AdminVerificationQueueData"
        meta:
          $ref: "#/components/schemas/Metadata"
    EvidenceAccessInput:
      type: object
      additionalProperties: false
      required: [purpose, reason]
      properties:
        purpose:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_.-]{2,63}$
        reason:
          type: string
          minLength: 8
          maxLength: 240
    VerificationEvidenceData:
      type: object
      additionalProperties: false
      required: [caseId, maskedCard, ageBand, providerStatus]
      properties:
        caseId:
          type: string
        maskedCard:
          type: string
          description: Only the final four card characters are visible.
        ageBand:
          type: string
          enum: [under_18, 18_24, 25_34, 35_49, 50_plus]
        providerStatus:
          type: string
          enum: [provider_outage, provider_uncertain, manual_review]
    VerificationEvidenceEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/VerificationEvidenceData"
        meta:
          $ref: "#/components/schemas/Metadata"
    VerificationDecisionInput:
      type: object
      additionalProperties: false
      required: [outcome, reason, expectedVersion]
      properties:
        outcome:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          minLength: 8
          maxLength: 240
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
    VerificationDecisionData:
      type: object
      additionalProperties: false
      required: [case, outcome, replayed]
      properties:
        case:
          $ref: "#/components/schemas/AdminVerificationCaseData"
        outcome:
          type: string
          enum: [approve, reject]
        replayed:
          type: boolean
    VerificationDecisionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/VerificationDecisionData"
        meta:
          $ref: "#/components/schemas/Metadata"
    PrivacyRequestInput:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    PrivacyRequestData:
      type: object
      additionalProperties: false
      required: [requestId, kind, status, dueAt]
      properties:
        requestId:
          type: string
        kind:
          type: string
          enum: [export, deletion]
        status:
          type: string
          enum: [requested, processing, completed, blocked_legal_hold]
        dueAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    PrivacyRequestEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/PrivacyRequestData"
        meta:
          $ref: "#/components/schemas/Metadata"
    TrustPathReason:
      type: string
      enum:
        - shared_circle
        - vouched_connection
        - known_connection
        - host_connection
    TrustPathStep:
      type: object
      additionalProperties: false
      required: [sourceId, targetId, reason]
      properties:
        sourceId:
          type: string
        targetId:
          type: string
        reason:
          $ref: "#/components/schemas/TrustPathReason"
    TrustPath:
      type: object
      additionalProperties: false
      required: [targetId, hops, steps]
      properties:
        targetId:
          type: string
        hops:
          type: integer
          minimum: 1
          maximum: 4
        steps:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/TrustPathStep"
    TrustPathsData:
      type: object
      additionalProperties: false
      required: [paths]
      properties:
        paths:
          type: array
          maxItems: 99
          items:
            $ref: "#/components/schemas/TrustPath"
    TrustPathsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/TrustPathsData"
        meta:
          $ref: "#/components/schemas/Metadata"
    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          $ref: "#/components/schemas/Error"
        meta:
          $ref: "#/components/schemas/Metadata"
