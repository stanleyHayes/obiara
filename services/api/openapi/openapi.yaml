openapi: 3.1.0
info:
  title: Obiara API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Authoritative REST contract for Obiara member clients. Durable API changes
    are additive within v1. Retriable writes require an Idempotency-Key.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: API root
tags:
  - name: Health
    description: Process and required-dependency health probes.
  - name: Members
    description: Member account commands and resources.
  - name: Trust
    description: Owner-bound, privacy-filtered and bounded trust explanations.
  - name: Admin Verification
    description: Least-privilege human verification desk operations.
paths:
  /live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Report process liveness
      security: []
      responses:
        "200":
          description: The API process is alive.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/plain:
              schema:
                type: string
                const: ok
        "405":
          description: The HTTP method is not supported for this route.
  /ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Report required-dependency readiness
      security: []
      responses:
        "200":
          description: Required dependencies are available.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/plain:
              schema:
                type: string
                const: ok
        "503":
          description: A required dependency is unavailable.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/plain:
              schema:
                type: string
                const: dependency unavailable
        "405":
          description: The HTTP method is not supported for this route.
  /v1/members:
    post:
      operationId: registerMember
      tags: [Members]
      summary: Register the baseline member record
      security: []
      description: |
        Creates the baseline member record through the member application
        boundary. Repeated delivery must use the same Idempotency-Key.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMemberRequest"
      responses:
        "201":
          description: Member registered.
          headers:
            Location:
              description: Relative URL of the created member.
              schema:
                type: string
                pattern: ^/v1/members/
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/MemberConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/waitlist:
    post:
      operationId: joinLaunchWaitlist
      tags: [Members]
      summary: Join the launch availability waiting list
      security: []
      description: Records purpose-specific consent for one launch availability email. Repeated submissions of the same normalized email are idempotent. Submissions are throttled per client IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinWaitlistRequest"
      responses:
        "200":
          description: The address was already on the waiting list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinWaitlistEnvelope"
        "201":
          description: A new waiting-list place was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinWaitlistEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/WaitlistRateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/otp:
    post:
      operationId: requestOtp
      tags: [Auth]
      summary: Request a phone OTP challenge
      security: []
      description: |
        Issues a 6-digit code to the phone via the active OTP provider
        (SMS with WhatsApp fallback). Subject to per-phone resend
        throttling. The response never contains the code.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "202":
          description: Code sent (or silently accepted for unknown numbers).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/OtpRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Verify a phone OTP and issue a session
      security: []
      description: |
        Verifies the latest challenge for the phone, finds or creates the
        account (exactly one active account per phone) and issues a
        short-lived access token plus a rotated refresh token.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Session issued.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/OtpInvalid"
        "403":
          $ref: "#/components/responses/AccountNotActive"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/OtpRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/verifications/ghana-card:
    post:
      operationId: submitGhanaCard
      tags: [Verification]
      summary: Submit a Ghana Card for identity verification
      security:
        - MemberBearer: []
      description: |
        Opens a verification case and asks the issuer provider. Approved
        submissions promote the account to Tier 1. Provider outage or
        uncertainty routes the case to the human fallback queue (202) —
        never a silent pass. Rejections return 422 verification_rejected.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GhanaCardInput"
      responses:
        "201":
          description: Verification decided (approved).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCaseEnvelope"
        "202":
          description: Case routed to the human fallback queue.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCaseEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: A valid member session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/VerificationRejected"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/onboarding/consents:
    post:
      operationId: acceptOnboardingConsents
      tags: [Privacy]
      summary: Accept the current Promise, terms and adult-age affirmation
      security:
        - MemberBearer: []
      description: |
        Records three separately versioned immutable consent receipts for the
        authenticated member. Replaying the same Idempotency-Key repairs or
        returns the original result without duplicating receipts.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: All required onboarding acknowledgements are recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingConsentEnvelope"
        "401":
          description: A valid member session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The command conflicts with an existing consent receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/verifications/liveness:
    post:
      operationId: submitLiveness
      tags: [Verification]
      summary: Submit temporary voice and face artifacts for liveness assessment
      security:
        - MemberBearer: []
      description: |
        The API retains only keyed proof. Temporary artifact references are
        kept in a 24-hour TTL queue only when human review is required.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LivenessInput"
      responses:
        "201":
          description: Liveness passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessEnvelope"
        "202":
          description: Provider uncertainty or outage queued for human review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessEnvelope"
        "401":
          description: A valid member session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The idempotency key conflicts with an earlier input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/verifications/liveness/artifacts:
    post:
      operationId: uploadLivenessArtifacts
      tags: [Verification]
      summary: Encrypt and retain bounded temporary liveness captures
      security:
        - MemberBearer: []
      description: |
        Accepts a short audio capture and JPEG face frame. Both are encrypted
        at the application boundary and automatically expire within 24 hours.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LivenessArtifactInput"
      responses:
        "201":
          description: Captures encrypted and stored temporarily.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessArtifactEnvelope"
        "401":
          description: A valid member session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/membership:
    get:
      operationId: getOwnMembership
      tags: [Commerce]
      summary: Read the authenticated member's current pass
      security:
        - MemberBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current pass, paid-through, grace and refund state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipEnvelope"
        "401":
          description: A valid member session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No membership pass exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/membership/cancel:
    post:
      operationId: cancelOwnMembership
      tags: [Commerce]
      summary: Stop renewal while preserving paid-through access
      security:
        - MemberBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancellation recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipEnvelope"
        "401":
          description: A valid member session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No membership pass exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Cancellation is not valid in the current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/membership/refunds:
    post:
      operationId: requestOwnMembershipRefund
      tags: [Commerce]
      summary: Request review of a cancelled membership payment
      security:
        - MemberBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Refund review requested; provider confirmation remains required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipEnvelope"
        "401":
          description: A valid member session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No membership pass exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Refund review is not valid in the current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/privacy/exports:
    post:
      operationId: requestExport
      tags: [Privacy]
      summary: Request a data export
      security:
        - MemberBearer: []
      description: |
        Opens an export request. The machine-readable archive is delivered
        within 72 hours (FR-106). One open request per kind per account.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestInput"
      responses:
        "201":
          description: Export request opened.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/PrivacyRequestExists"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/privacy/deletions:
    post:
      operationId: requestDeletion
      tags: [Privacy]
      summary: Request account deletion
      security:
        - MemberBearer: []
      description: |
        Opens a deletion request completed within 30 days with
        cryptographic erasure of voice/biometric blobs (FR-106). Active
        legal holds block deletion with 409 legal_hold_active.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestInput"
      responses:
        "201":
          description: Deletion request opened.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/PrivacyRequestExists"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/privacy/requests/{id}:
    get:
      operationId: privacyRequestStatus
      tags: [Privacy]
      summary: Read a privacy request status
      security:
        - MemberBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request status.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestEnvelope"
        "404":
          $ref: "#/components/responses/PrivacyRequestNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/members/{memberId}/trust-paths:
    get:
      operationId: getMemberTrustPaths
      tags: [Trust]
      summary: Read the authenticated member's visible trust paths
      description: |
        Returns only forward paths whose current edges, consent and endpoints
        remain visible to the authenticated owner. Authentication, owner
        mismatch, hidden resources and policy denial all return the same 404
        response. This contract exposes no global or reverse graph operation.
      security:
        - MemberBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        - name: depth
          in: query
          required: false
          description: Maximum forward traversal depth.
          schema:
            type: integer
            minimum: 1
            maximum: 4
            default: 3
        - name: nodes
          in: query
          required: false
          description: Maximum number of visited nodes, including the owner.
          schema:
            type: integer
            minimum: 2
            maximum: 100
            default: 50
      responses:
        "200":
          description: Privacy-filtered trust explanations, possibly empty.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustPathsEnvelope"
        "400":
          $ref: "#/components/responses/InvalidTrustPathBounds"
        "404":
          $ref: "#/components/responses/TrustPathsNotFound"
  /v1/admin/verifications:
    get:
      operationId: listAdminVerificationQueue
      tags: [Admin Verification]
      summary: List privacy-redacted verification cases
      description: Requires the verification.queue.read capability.
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Oldest queued verification cases, without raw evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerificationQueueEnvelope"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/verifications/{id}:
    get:
      operationId: getAdminVerificationCase
      tags: [Admin Verification]
      summary: Read privacy-redacted verification case detail
      description: Requires the verification.queue.read capability.
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redacted case detail; raw card and birth date are excluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerificationCaseEnvelope"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/VerificationCaseNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/verifications/{id}/evidence-access:
    post:
      operationId: accessAdminVerificationEvidence
      tags: [Admin Verification]
      summary: Access bounded verification evidence and create an audit event
      description: |
        Requires verification.evidence.read, recent MFA, a bounded purpose,
        and a reason. Every successful access writes a dedicated audit event.
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceAccessInput"
      responses:
        "200":
          description: Bounded evidence returned after the audit write succeeds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationEvidenceEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/VerificationCaseNotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/verifications/{id}/decisions:
    post:
      operationId: decideAdminVerificationCase
      tags: [Admin Verification]
      summary: Approve or reject a queued verification case
      description: |
        Requires verification.review. The reason, expected version, and
        Idempotency-Key make retries deterministic and stale writes fail closed.
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationDecisionInput"
      responses:
        "200":
          description: Decision committed or an identical command replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDecisionEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/VerificationCaseNotFound"
        "409":
          $ref: "#/components/responses/VerificationCaseConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/profile:
    get:
      operationId: getOwnProfile
      tags: [Profile]
      summary: Read the authenticated member's profile
      security:
        - MemberBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The member's own profile and field visibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
          description: A valid member session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The member has not created a profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: upsertOwnProfile
      tags: [Profile]
      summary: Create or update the authenticated member's profile
      security:
        - MemberBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "201":
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
