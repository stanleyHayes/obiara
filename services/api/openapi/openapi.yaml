openapi: 3.1.0
info:
  title: Obiara API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Authoritative REST contract for Obiara member clients. Durable API changes
    are additive within v1. Retriable writes require an Idempotency-Key.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: API root
tags:
  - name: Health
    description: Process and required-dependency health probes.
  - name: Members
    description: Member account commands and resources.
  - name: Trust
    description: Owner-bound, privacy-filtered and bounded trust explanations.
  - name: Admin Verification
    description: Least-privilege human verification desk operations.
paths:
  /live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Report process liveness
      security: []
      responses:
        "200":
          description: The API process is alive.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/plain:
              schema:
                type: string
                const: ok
        "405":
          description: The HTTP method is not supported for this route.
  /ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Report required-dependency readiness
      security: []
      responses:
        "200":
          description: Required dependencies are available.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/plain:
              schema:
                type: string
                const: ok
        "503":
          description: A required dependency is unavailable.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/plain:
              schema:
                type: string
                const: dependency unavailable
        "405":
          description: The HTTP method is not supported for this route.
  /v1/members:
    post:
      operationId: registerMember
      tags: [Members]
      summary: Register the baseline member record
      security: []
      description: |
        Creates the baseline member record through the member application
        boundary. Repeated delivery must use the same Idempotency-Key.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMemberRequest"
      responses:
        "201":
          description: Member registered.
          headers:
            Location:
              description: Relative URL of the created member.
              schema:
                type: string
                pattern: ^/v1/members/
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/MemberConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/otp:
    post:
      operationId: requestOtp
      tags: [Auth]
      summary: Request a phone OTP challenge
      security: []
      description: |
        Issues a 6-digit code to the phone via the active OTP provider
        (SMS with WhatsApp fallback). Subject to per-phone resend
        throttling. The response never contains the code.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "202":
          description: Code sent (or silently accepted for unknown numbers).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/OtpRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Verify a phone OTP and issue a session
      security: []
      description: |
        Verifies the latest challenge for the phone, finds or creates the
        account (exactly one active account per phone) and issues a
        short-lived access token plus a rotated refresh token.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Session issued.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/OtpInvalid"
        "403":
          $ref: "#/components/responses/AccountNotActive"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/OtpRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/verifications/ghana-card:
    post:
      operationId: submitGhanaCard
      tags: [Verification]
      summary: Submit a Ghana Card for identity verification
      security: []
      description: |
        Opens a verification case and asks the issuer provider. Approved
        submissions promote the account to Tier 1. Provider outage or
        uncertainty routes the case to the human fallback queue (202) —
        never a silent pass. Rejections return 422 verification_rejected.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GhanaCardInput"
      responses:
        "201":
          description: Verification decided (approved).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCaseEnvelope"
        "202":
          description: Case routed to the human fallback queue.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCaseEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/VerificationRejected"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/privacy/exports:
    post:
      operationId: requestExport
      tags: [Privacy]
      summary: Request a data export
      security: []
      description: |
        Opens an export request. The machine-readable archive is delivered
        within 72 hours (FR-106). One open request per kind per account.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestInput"
      responses:
        "201":
          description: Export request opened.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/PrivacyRequestExists"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/privacy/deletions:
    post:
      operationId: requestDeletion
      tags: [Privacy]
      summary: Request account deletion
      security: []
      description: |
        Opens a deletion request completed within 30 days with
        cryptographic erasure of voice/biometric blobs (FR-106). Active
        legal holds block deletion with 409 legal_hold_active.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestInput"
      responses:
        "201":
          description: Deletion request opened.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/PrivacyRequestExists"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/privacy/requests/{id}:
    get:
      operationId: privacyRequestStatus
      tags: [Privacy]
      summary: Read a privacy request status
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request status.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestEnvelope"
        "404":
          $ref: "#/components/responses/PrivacyRequestNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/members/{memberId}/trust-paths:
    get:
      operationId: getMemberTrustPaths
      tags: [Trust]
      summary: Read the authenticated member's visible trust paths
      description: |
        Returns only forward paths whose current edges, consent and endpoints
        remain visible to the authenticated owner. Authentication, owner
        mismatch, hidden resources and policy denial all return the same 404
        response. This contract exposes no global or reverse graph operation.
      security:
        - MemberBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        - name: depth
          in: query
          required: false
          description: Maximum forward traversal depth.
          schema:
            type: integer
            minimum: 1
            maximum: 4
            default: 3
        - name: nodes
          in: query
          required: false
          description: Maximum number of visited nodes, including the owner.
          schema:
            type: integer
            minimum: 2
            maximum: 100
            default: 50
      responses:
        "200":
          description: Privacy-filtered trust explanations, possibly empty.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustPathsEnvelope"
        "400":
          $ref: "#/components/responses/InvalidTrustPathBounds"
        "404":
          $ref: "#/components/responses/TrustPathsNotFound"
  /v1/admin/verifications:
    get:
      operationId: listAdminVerificationQueue
      tags: [Admin Verification]
      summary: List privacy-redacted verification cases
      description: Requires the verification.queue.read capability.
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Oldest queued verification cases, without raw evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerificationQueueEnvelope"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/verifications/{id}:
    get:
      operationId: getAdminVerificationCase
      tags: [Admin Verification]
      summary: Read privacy-redacted verification case detail
      description: Requires the verification.queue.read capability.
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redacted case detail; raw card and birth date are excluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerificationCaseEnvelope"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/VerificationCaseNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/verifications/{id}/evidence-access:
    post:
      operationId: accessAdminVerificationEvidence
      tags: [Admin Verification]
      summary: Access bounded verification evidence and create an audit event
      description: |
        Requires verification.evidence.read, recent MFA, a bounded purpose,
        and a reason. Every successful access writes a dedicated audit event.
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceAccessInput"
      responses:
        "200":
          description: Bounded evidence returned after the audit write succeeds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationEvidenceEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/VerificationCaseNotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/verifications/{id}/decisions:
    post:
      operationId: decideAdminVerificationCase
      tags: [Admin Verification]
      summary: Approve or reject a queued verification case
      description: |
        Requires verification.review. The reason, expected version, and
        Idempotency-Key make retries deterministic and stale writes fail closed.
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationDecisionInput"
      responses:
        "200":
          description: Decision committed or an identical command replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDecisionEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/VerificationCaseNotFound"
        "409":
          $ref: "#/components/responses/VerificationCaseConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/doorway-question:
    put:
      operationId: setDoorwayQuestion
      tags: [Profile]
      summary: Set the member's doorway question
      security: []
      description: |
        Sets or replaces the one question sowers must answer (Doc 06 S-07).
        1-60 characters; contact details and links are rejected.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoorwayQuestionInput"
      responses:
        "200":
          description: Question saved.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoorwayQuestionEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/doorway-question/{memberId}:
    get:
      operationId: getDoorwayQuestion
      tags: [Profile]
      summary: Read a member's doorway question
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The doorway question.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoorwayQuestionEnvelope"
        "404":
          $ref: "#/components/responses/DoorwayQuestionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/photo-vault/items:
    post:
      operationId: addVaultItem
      tags: [Profile]
      summary: Add a photo to the vault
      security: []
      description: |
        Registers an uploaded media asset in the member's vault at a free
        position. Everything in the vault is veiled to non-owners until
        acceptance exists (Doc 06 S-08).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultItemInput"
      responses:
        "201":
          description: Item added.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultItemEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/VaultConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/photo-vault/{ownerId}:
    get:
      operationId: viewVault
      tags: [Profile]
      summary: View a member's photo vault with server-side veiling
      security: []
      description: |
        Lists vault items in position order. Items are veiled for every
        viewer except the owner until acceptance-based unveiling lands with
        the seed economy (E06).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
        - name: viewerId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Vault items with veil flags.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultViewEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/listening/heartbeats:
    post:
      operationId: recordListeningHeartbeats
      tags: [Seeds]
      summary: Report voice playback telemetry
      security: []
      description: |
        Merges client-reported playback ranges into the server-side unique
        cumulative total (FR-202). Duplicate, out-of-order and replayed
        ranges never double-count. Partial-listen state is never exposed
        to the voice owner (FR-205).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatsInput"
      responses:
        "200":
          description: Updated eligibility state for the sow boundary.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/listening/eligibility/{assetId}:
    get:
      operationId: getListeningEligibility
      tags: [Seeds]
      summary: Read sow eligibility for a voice asset
      security: []
      description: |
        Server-verified eligibility: eligible once unique cumulative
        playback reaches 20 seconds (FR-202). Read by the sowing member's
        own client only.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: assetId
          in: path
          required: true
          schema:
            type: string
        - name: listenerId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eligibility state.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/fires:
    post:
      operationId: scheduleFire
      tags: [Fires]
      summary: Schedule a fire
      security: []
      description: Creates a scheduled fire with bounded capacity (E09-S01).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FireInput"
      responses:
        "201":
          description: Fire scheduled.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listUpcomingFires
      tags: [Fires]
      summary: List upcoming fires
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: circleId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Upcoming fires in start order.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireListEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/fires/{id}/rsvps:
    post:
      operationId: rsvpFire
      tags: [Fires]
      summary: RSVP to a fire
      security: []
      description: |
        Admits a Tier 1+ member (FR-401). Capacity is race-safe: when the
        fire is full the member is waitlisted with a position. Duplicate
        RSVPs return 409 rsvp_exists.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpInput"
      responses:
        "201":
          description: RSVP recorded.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/TierTooLow"
        "404":
          $ref: "#/components/responses/FireNotFound"
        "409":
          $ref: "#/components/responses/RsvpConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/fires/{id}/rsvps/{memberId}:
    delete:
