openapi: 3.1.0
info:
  title: Obiara API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Authoritative REST contract for Obiara member clients. Durable API changes
    are additive within v1. Retriable writes require an Idempotency-Key.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: API root
tags:
  - name: Health
    description: Process and required-dependency health probes.
  - name: Members
    description: Member account commands and resources.
paths:
  /live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Report process liveness
      security: []
      responses:
        "200":
          description: The API process is alive.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/plain:
              schema:
                type: string
                const: ok
        "405":
          description: The HTTP method is not supported for this route.
  /ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Report required-dependency readiness
      security: []
      responses:
        "200":
          description: Required dependencies are available.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/plain:
              schema:
                type: string
                const: ok
        "503":
          description: A required dependency is unavailable.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            text/plain:
              schema:
                type: string
                const: dependency unavailable
        "405":
          description: The HTTP method is not supported for this route.
  /v1/members:
    post:
      operationId: registerMember
      tags: [Members]
      summary: Register the baseline member record
      security: []
      description: |
        Creates the baseline member record through the member application
        boundary. Repeated delivery must use the same Idempotency-Key.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMemberRequest"
      responses:
        "201":
          description: Member registered.
          headers:
            Location:
              description: Relative URL of the created member.
              schema:
                type: string
                pattern: ^/v1/members/
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/MemberConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/otp:
    post:
      operationId: requestOtp
      tags: [Auth]
      summary: Request a phone OTP challenge
      security: []
      description: |
        Issues a 6-digit code to the phone via the active OTP provider
        (SMS with WhatsApp fallback). Subject to per-phone resend
        throttling. The response never contains the code.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "202":
          description: Code sent (or silently accepted for unknown numbers).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/OtpRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Verify a phone OTP and issue a session
      security: []
      description: |
        Verifies the latest challenge for the phone, finds or creates the
        account (exactly one active account per phone) and issues a
        short-lived access token plus a rotated refresh token.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Session issued.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/OtpInvalid"
        "403":
          $ref: "#/components/responses/AccountNotActive"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/OtpRateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/verifications/ghana-card:
    post:
      operationId: submitGhanaCard
      tags: [Verification]
      summary: Submit a Ghana Card for identity verification
      security: []
      description: |
        Opens a verification case and asks the issuer provider. Approved
        submissions promote the account to Tier 1. Provider outage or
        uncertainty routes the case to the human fallback queue (202) —
        never a silent pass. Rejections return 422 verification_rejected.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GhanaCardInput"
      responses:
        "201":
          description: Verification decided (approved).
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCaseEnvelope"
        "202":
          description: Case routed to the human fallback queue.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationCaseEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/VerificationRejected"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Safe caller-provided identifier; invalid values are replaced.
      schema:
        $ref: "#/components/schemas/CorrelationId"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key reused for retries of the same command.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
  headers:
    CorrelationId:
      required: true
      description: Effective request correlation identifier.
      schema:
        $ref: "#/components/schemas/CorrelationId"
  responses:
    InvalidJSON:
      description: The body is malformed, oversized, contains unknown fields, or contains multiple values.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalidJSON:
              value:
                error:
                  code: invalid_json
                  message: The request body must be one valid JSON object.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    UnsupportedMediaType:
      description: Content-Type is not application/json.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MemberConflict:
      description: A member with the same identifier already exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            memberConflict:
              value:
                error:
                  code: member_conflict
                  message: A member with this identifier already exists.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    OtpRateLimited:
      description: Too many OTP requests for this phone number.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            otpRateLimited:
              value:
                error:
                  code: otp_rate_limited
                  message: Too many code requests. Please wait and try again.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    OtpInvalid:
      description: The code is invalid, expired, consumed, or attempts are exhausted.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            otpInvalid:
              value:
                error:
                  code: otp_invalid
                  message: The code is not valid for this number.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    AccountNotActive:
      description: The account is blocked or deleted.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            accountNotActive:
              value:
                error:
                  code: account_not_active
                  message: This account is not active.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    VerificationRejected:
      description: The issuer provider rejected the document.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            verificationRejected:
              value:
                error:
                  code: verification_rejected
                  message: The document could not be verified with the issuer.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    ValidationFailed:
      description: Request fields or the idempotency key are invalid.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalidEmail:
              value:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  details:
                    - field: email
                      reason: must be a valid email address
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    InternalError:
      description: An unexpected server failure occurred.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: The application capability is temporarily unavailable.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    CorrelationId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    RegisterMemberRequest:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        email:
          type: string
          format: email
          maxLength: 254
    Member:
      type: object
      additionalProperties: false
      required: [id, email, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    Metadata:
      type: object
      additionalProperties: false
      required: [correlationId]
      properties:
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
    MemberEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Member"
        meta:
          $ref: "#/components/schemas/Metadata"
    PhoneNumber:
      type: string
      pattern: ^\+[1-9]\d{7,14}$
      description: E.164 phone number.
    OtpRequestInput:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          $ref: "#/components/schemas/PhoneNumber"
    OtpRequestData:
      type: object
      additionalProperties: false
      required: [challengeId, expiresAt]
      properties:
        challengeId:
          type: string
        expiresAt:
          type: string
          format: date-time
    OtpRequestEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/OtpRequestData"
        meta:
          $ref: "#/components/schemas/Metadata"
    OtpVerifyInput:
      type: object
      additionalProperties: false
      required: [phone, code, deviceId]
      properties:
        phone:
          $ref: "#/components/schemas/PhoneNumber"
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    SessionData:
      type: object
      additionalProperties: false
      required:
        [
          sessionId,
          memberId,
          accessToken,
          accessExpiresAt,
          refreshToken,
          refreshExpiresAt,
        ]
      properties:
        sessionId:
          type: string
        memberId:
          type: string
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
    SessionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/SessionData"
        meta:
          $ref: "#/components/schemas/Metadata"
    GhanaCardInput:
      type: object
      additionalProperties: false
      required: [accountId, cardNumber, dateOfBirth]
      properties:
        accountId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        cardNumber:
          type: string
          minLength: 1
          maxLength: 32
        dateOfBirth:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Date of birth as YYYY-MM-DD.
    VerificationCaseData:
      type: object
      additionalProperties: false
      required: [caseId, status]
      properties:
        caseId:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, queued_manual]
    VerificationCaseEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/VerificationCaseData"
        meta:
          $ref: "#/components/schemas/Metadata"
    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          $ref: "#/components/schemas/Error"
        meta:
          $ref: "#/components/schemas/Metadata"
