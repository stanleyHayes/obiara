        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/circles/{circleId}/stories/{storyId}/publish:
    post:
      operationId: publishAnansesemStory
      tags: [Community]
      summary: Publish the current draft after both fingerprint-bound grants
      security:
        - MemberBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CircleRoomId"
        - $ref: "#/components/parameters/AnansesemStoryId"
