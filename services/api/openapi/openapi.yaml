            application/json:
              schema:
                $ref: "#/components/schemas/AnansesemEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AnansesemNotAvailable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/consent:
    get:
      operationId: getOwnConsentSwitchboard
      tags: [Privacy]
      summary: Read the signed-in member's consent switchboard
      security:
        - MemberBearer: []
      responses:
        "200":
          description: Purpose states.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentSwitchboardEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/consent/purposes/{purpose}:
    put:
      operationId: setOwnConsentPurpose
      tags: [Privacy]
      summary: Change a consent purpose for the signed-in member
      security:
        - MemberBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: purpose
          in: path
          required: true
          schema:
            type: string
            enum:
              [
                identity_safety,
                matching_personalization,
                scam_arc_monitoring,
                play_portraits,
                product_analytics,
                profile_visibility,
              ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentPurposeInput"
      responses:
        "200":
          description: Purpose updated.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentStateEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/PurposeLocked"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnknownPurpose"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/consent/{memberId}:
    get:
      operationId: getConsentSwitchboard
      tags: [Privacy]
      summary: Read the member's consent switchboard
      security:
        - MemberBearer: []
      description: Effective state for every consent-map purpose (Doc 08 §8).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Purpose states.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentSwitchboardEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/consent/{memberId}/{purpose}:
    put:
      operationId: setConsentPurpose
      tags: [Privacy]
      summary: Change a consent purpose
      security:
        - MemberBearer: []
      description: |
        Applies a member toggle within the purpose's control level (Doc 08
        §8). Identity & safety processing is locked; opt-in purposes only
        enable, opt-out purposes only disable. Every change writes an
        immutable receipt.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: memberId
          in: path
          required: true
          schema:
            type: string
        - name: purpose
          in: path
          required: true
          schema:
            type: string
            enum:
              [
                identity_safety,
                matching_personalization,
                scam_arc_monitoring,
                play_portraits,
                product_analytics,
                profile_visibility,
              ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentPurposeInput"
      responses:
        "200":
          description: Purpose updated.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentStateEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "409":
          $ref: "#/components/responses/PurposeLocked"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnknownPurpose"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/market-packs:
    get:
      operationId: listAdminMarketPacks
      tags: [Admin]
      summary: List the complete market-pack governance register
      description: Requires operations scope. Actor identifiers are never projected; only whether the current operator proposed or approved a pack is returned.
      security:
        - AdminBearer: []
      responses:
        "200":
          description: Draft, published and retired packs, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPackListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRoleRequired"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: draftMarketPack
      tags: [Admin]
      summary: Draft a market pack
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPackInput"
      responses:
        "201":
          description: Pack drafted.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPackEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/market-packs/{id}/publish:
    post:
      operationId: publishMarketPack
      tags: [Admin]
      summary: Publish a market pack (four-eyes)
      security:
        - AdminBearer: []
      description: The approver must differ from the proposer; audited (E16-S06).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackActorInput"
      responses:
        "200":
          description: Pack published.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPackEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "404":
          $ref: "#/components/responses/PackNotFound"
        "409":
          $ref: "#/components/responses/SelfApproval"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/market-packs/{id}/retire:
    post:
      operationId: retireMarketPack
      tags: [Admin]
      summary: Retire a market pack
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackActorInput"
      responses:
        "200":
          description: Pack retired.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPackEnvelope"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "404":
          $ref: "#/components/responses/PackNotFound"
        "409":
          $ref: "#/components/responses/PackState"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/market-packs/published:
    get:
      operationId: listPublishedMarketPacks
      tags: [Admin]
      summary: List published market packs
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: market
          in: query
          required: false
          schema:
            type: string
            enum: [gh_en, gh_tw, gh_pidgin, gh_ga]
      responses:
        "200":
          description: Published packs.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPackListEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: Short-lived member access token; the session subject must match memberId.
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff token carrying the explicitly documented capability and recent-MFA claim where required.
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Safe caller-provided identifier; invalid values are replaced.
      schema:
        $ref: "#/components/schemas/CorrelationId"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key reused for retries of the same command.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    CircleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CircleMemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CircleRoomId:
      name: circleId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OwareGameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AnansesemStoryId:
      name: storyId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AmpeRoundId:
      name: roundId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    EbeDuelId:
      name: duelId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CompetitionCohortId:
      name: cohortId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    CompetitionId:
      name: competitionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    CompetitionMatchId:
      name: matchId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    CompetitionReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  requestBodies:
    CircleMutation:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CircleMutationInput"
    CompetitionCohortMutation:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompetitionRevisionInput" }
  headers:
    CorrelationId:
      required: true
      description: Effective request correlation identifier.
      schema:
        $ref: "#/components/schemas/CorrelationId"
  responses:
    Unauthorized:
      description: A valid authenticated session is required.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CircleNotFound:
      description: The circle is absent, private, or otherwise unavailable to this member.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CircleConflict:
      description: The circle revision or requested membership transition conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CircleMutationSucceeded:
      description: Circle membership updated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CircleEnvelope"
    CircleRoomNotFound:
      description: The room, circle membership, or entry is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OwareNotAvailable:
      description: The game or its exact two-member circle context is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AnansesemNotAvailable:
      description: The story or its exact two-member circle context is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AmpeNotAvailable:
      description: The round or its exact two-member circle context is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AmpeConflict:
      description: The round sequence changed before the command was applied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EbeNotAvailable:
      description: The approved prompt, duel, or exact two-member circle context is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EbeConflict:
      description: The duel revision changed before the answer was retained.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CompetitionNotAvailable:
      description: The invitation cohort or member-authorized bracket is unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    CompetitionConflict:
      description: The cohort or bracket revision changed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    CompetitionCohortSucceeded:
      description: Current privacy-safe cohort state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CompetitionCohortEnvelope" }
    InvalidJSON:
      description: The body is malformed, oversized, contains unknown fields, or contains multiple values.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalidJSON:
              value:
                error:
                  code: invalid_json
                  message: The request body must be one valid JSON object.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    UnsupportedMediaType:
      description: Content-Type is not application/json.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MemberConflict:
      description: A member with the same identifier already exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            memberConflict:
              value:
                error:
                  code: member_conflict
                  message: A member with this identifier already exists.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    OtpRateLimited:
      description: Too many OTP requests for this phone number.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            otpRateLimited:
              value:
                error:
                  code: otp_rate_limited
                  message: Too many code requests. Please wait and try again.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    WaitlistRateLimited:
      description: Too many waitlist join attempts from this client.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            waitlistRateLimited:
              value:
                error:
                  code: waitlist_rate_limited
                  message: Too many join attempts. Please wait and try again.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    OtpInvalid:
      description: The code is invalid, expired, consumed, or attempts are exhausted.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            otpInvalid:
              value:
                error:
                  code: otp_invalid
                  message: The code is not valid for this number.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    AccountNotActive:
      description: The account is blocked or deleted.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            accountNotActive:
              value:
                error:
                  code: account_not_active
                  message: This account is not active.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    VerificationRejected:
      description: The issuer provider rejected the document.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            verificationRejected:
              value:
                error:
                  code: verification_rejected
                  message: The document could not be verified with the issuer.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    PrivacyRequestExists:
      description: An open request of this kind already exists for the account.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            privacyRequestExists:
              value:
                error:
                  code: privacy_request_exists
                  message: An open request of this kind already exists.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    PrivacyRequestNotFound:
      description: No privacy request with this identifier exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            privacyRequestNotFound:
              value:
                error:
                  code: privacy_request_not_found
                  message: No such privacy request.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    InvalidTrustPathBounds:
      description: Trust path depth or node limits are outside the bounded contract.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalidBounds:
              value:
                error:
                  code: invalid_trust_path_bounds
                  message: Trust path limits are invalid.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    TrustPathsNotFound:
      description: |
        Trust paths are unavailable. This deliberately covers invalid
        authentication, owner mismatch, policy denial and hidden resources.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            notFound:
              value:
                error:
                  code: trust_paths_not_found
                  message: Trust paths are not available.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    AdminForbidden:
      description: The staff principal lacks the exact capability, or recent MFA where evidence access requires it.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    VerificationCaseNotFound:
      description: No verification case with this identifier exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    VerificationCaseConflict:
      description: The case is closed, stale, or the idempotency key belongs to another decision.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TierTooLow:
      description: The member's verification tier does not meet the requirement.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            tierTooLow:
              value:
                error:
                  code: tier_too_low
                  message: Fire entry requires full verification.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    FireNotFound:
      description: No fire with this identifier exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RsvpConflict:
      description: The member already has an RSVP, or the fire is not open.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RsvpNotFound:
      description: No RSVP exists for this member and fire.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotCoAttendee:
      description: Embers require co-attendance at the same fire.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            notCoAttendee:
              value:
                error:
                  code: not_co_attendee
                  message: Embers are only for people who attended the same fire.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    NotRecipient:
      description: Only the recipient may redeem an ember.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EmberConflict:
      description: The attendee already gave an ember, or the ember is expired/closed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EmberNotFound:
      description: No ember with this identifier exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NominationNotFound:
      description: No nomination with this identifier exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NominationConflict:
      description: A pending nomination already exists for this kin, or the nomination was already answered.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SafetyCannotBeMuted:
      description: Safety notifications cannot be muted, or the input is invalid.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            safetyCannotBeMuted:
              value:
                error:
                  code: safety_cannot_be_muted
                  message: Safety notifications cannot be turned off.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    BlockExists:
      description: The block edge already exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BlockNotFound:
      description: No block edge exists to remove.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SignatureInvalid:
      description: The webhook signature is missing, invalid, or the timestamp is stale.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            signatureInvalid:
              value:
                error:
                  code: signature_invalid
                  message: The webhook signature could not be verified.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    DeliveryNotFound:
      description: No delivery exists for the referenced provider id.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AdminRoleRequired:
      description: The actor lacks the required admin role.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PrincipalExists:
      description: A principal with that email already exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PrincipalNotFound:
      description: No admin principal for that account.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MfaInvalid:
      description: The MFA code is invalid, expired, consumed, or attempts are exhausted.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SessionClosed:
      description: The admin session is not active.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotHost:
      description: Only the host may close a fire.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    FireNotClosable:
      description: The fire is not in a state that can dim to embers.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotRoomMember:
      description: Calls are only between the two room members.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotParticipant:
      description: Only a call participant may end the call.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CallNotFound:
      description: No call with this identifier exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CallNotOpen:
      description: The call is already over.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MonitoringOptedOut:
      description: The room has opted out of scam-arc monitoring.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PurposeLocked:
      description: The purpose cannot be changed (required) or only allows the other direction.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            purposeLocked:
              value:
                error:
                  code: purpose_locked
                  message: Identity and safety processing is required for the service and cannot be turned off.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    UnknownPurpose:
      description: The consent purpose does not exist.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SelfApproval:
      description: The approver must differ from the proposer (four-eyes).
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PackNotFound:
      description: No market pack with this identifier exists.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PackState:
      description: The pack is not in the required state for this action.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: Request fields or the idempotency key are invalid.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalidEmail:
              value:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  details:
                    - field: email
                      reason: must be a valid email address
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    InternalError:
      description: An unexpected server failure occurred.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: The application capability is temporarily unavailable.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    VaultConflict:
      description: The vault is full or the position is already taken.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            vaultConflict:
              value:
                error:
                  code: vault_position_taken
                  message: That vault position is already taken.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
    DoorwayQuestionNotFound:
      description: No doorway question is set for this member.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            doorwayQuestionNotFound:
              value:
                error:
                  code: doorway_question_not_found
                  message: No doorway question is set.
                meta:
                  correlationId: 01J9EXAMPLE000000000000000
  schemas:
    CorrelationId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    RegisterMemberRequest:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        email:
          type: string
          format: email
          maxLength: 254
    JoinWaitlistRequest:
      type: object
      additionalProperties: false
      required: [name, email, consent]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        consent:
          type: boolean
          const: true
    JoinWaitlistData:
      type: object
      additionalProperties: false
      required: [email, alreadyJoined]
      properties:
        email:
          type: string
          format: email
        alreadyJoined:
          type: boolean
    JoinWaitlistEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/JoinWaitlistData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminWaitlistEntry:
      type: object
      additionalProperties: false
      required: [name, email, consentVersion, signedUpAt, notificationState]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        consentVersion: { type: string }
        signedUpAt: { type: string, format: date-time }
        notificationState: { type: string, enum: [pending, sent] }
        notifiedAt: { type: string, format: date-time }
    AdminWaitlistEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [entries]
          properties:
            entries:
              type: array
              items:
                $ref: "#/components/schemas/AdminWaitlistEntry"
        meta:
          $ref: "#/components/schemas/Metadata"
    Member:
      type: object
      additionalProperties: false
      required: [id, email, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    Metadata:
      type: object
      additionalProperties: false
      required: [correlationId]
      properties:
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
    MemberEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Member"
        meta:
          $ref: "#/components/schemas/Metadata"
    PhoneNumber:
      type: string
      pattern: ^\+[1-9]\d{7,14}$
      description: E.164 phone number.
    OtpRequestInput:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          $ref: "#/components/schemas/PhoneNumber"
    OtpRequestData:
      type: object
      additionalProperties: false
      required: [challengeId, expiresAt]
      properties:
        challengeId:
          type: string
        expiresAt:
          type: string
          format: date-time
    OtpRequestEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/OtpRequestData"
        meta:
          $ref: "#/components/schemas/Metadata"
    OtpVerifyInput:
      type: object
      additionalProperties: false
      required: [phone, code, deviceId]
      properties:
        phone:
          $ref: "#/components/schemas/PhoneNumber"
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    SessionData:
      type: object
      additionalProperties: false
      required:
        [
          sessionId,
          memberId,
          accessToken,
          accessExpiresAt,
          refreshToken,
          refreshExpiresAt,
        ]
      properties:
        sessionId:
          type: string
        memberId:
          type: string
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
    SessionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/SessionData"
        meta:
          $ref: "#/components/schemas/Metadata"
    GhanaCardInput:
      type: object
      additionalProperties: false
      required: [cardNumber, dateOfBirth]
      properties:
        cardNumber:
          type: string
          minLength: 1
          maxLength: 32
        dateOfBirth:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Date of birth as YYYY-MM-DD.
    MembershipData:
      type: object
      additionalProperties: false
      required:
        [
          passId,
          passName,
          status,
          paidThrough,
          graceUntil,
          renewsAutomatically,
          receiptRef,
          revision,
        ]
      properties:
        passId:
          type: string
        passName:
          type: string
        status:
          type: string
          enum: [active, grace, expired, refund_pending, refunded]
        paidThrough:
          type: string
          format: date-time
        graceUntil:
          type: string
          format: date-time
        renewsAutomatically:
          type: boolean
        receiptRef:
          type: string
        refundRequestRef:
          type: string
        revision:
          type: integer
          minimum: 1
    MembershipEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/MembershipData"
        meta:
          $ref: "#/components/schemas/Metadata"
    OnboardingConsentData:
      type: object
      additionalProperties: false
      required: [promiseRevision, termsRevision, ageRevision]
      properties:
        promiseRevision:
          type: integer
          minimum: 1
        termsRevision:
          type: integer
          minimum: 1
        ageRevision:
          type: integer
          minimum: 1
    OnboardingConsentEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/OnboardingConsentData"
        meta:
          $ref: "#/components/schemas/Metadata"
    LivenessInput:
      type: object
      additionalProperties: false
      required: [voiceArtifactRef, faceArtifactRef]
      properties:
        voiceArtifactRef:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        faceArtifactRef:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    LivenessArtifactInput:
      type: object
      additionalProperties: false
      required: [voiceMediaType, voiceBase64, faceMediaType, faceBase64]
      properties:
        voiceMediaType:
          type: string
          pattern: ^audio/
        voiceBase64:
          type: string
          minLength: 1
        faceMediaType:
          type: string
          enum: [image/jpeg]
        faceBase64:
          type: string
          minLength: 1
    LivenessArtifactData:
      type: object
      additionalProperties: false
      required: [voiceArtifactRef, faceArtifactRef, expiresAt]
      properties:
        voiceArtifactRef:
          type: string
        faceArtifactRef:
          type: string
        expiresAt:
          type: string
          format: date-time
    LivenessArtifactEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/LivenessArtifactData"
        meta:
          $ref: "#/components/schemas/Metadata"
    LivenessData:
      type: object
      additionalProperties: false
      required: [attemptId, status, replayed]
      properties:
        attemptId:
          type: string
        status:
          type: string
          enum: [passed, queued_manual]
        replayed:
          type: boolean
    LivenessEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/LivenessData"
        meta:
          $ref: "#/components/schemas/Metadata"
    VerificationCaseData:
      type: object
      additionalProperties: false
      required: [caseId, status]
      properties:
        caseId:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, queued_manual]
    VerificationCaseEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/VerificationCaseData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminVerificationCaseData:
      type: object
      additionalProperties: false
      required: [caseId, subjectRef, reasonCode, submittedAt, version]
      properties:
        caseId:
          type: string
        subjectRef:
          type: string
          description: Stable pseudonymous subject reference; never the account identifier.
        reasonCode:
          type: string
          enum: [provider_outage, provider_uncertain, manual_review]
        submittedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [queued_manual, approved, rejected]
        version:
          type: integer
          format: int64
          minimum: 1
    AdminVerificationCaseEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AdminVerificationCaseData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminVerificationQueueData:
      type: object
      additionalProperties: false
      required: [cases]
      properties:
        cases:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminVerificationCaseData"
    AdminVerificationQueueEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AdminVerificationQueueData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminSafetyCaseData:
      type: object
      additionalProperties: false
      required:
        [
          caseId,
          subjectRef,
          tier,
          queue,
          status,
          slaDueAt,
          assigned,
          assignedToMe,
          version,
        ]
      properties:
        caseId:
          type: string
        subjectRef:
          type: string
          description: Stable privacy-keyed subject reference; never the member account identifier.
        tier:
          type: string
          enum: [A, B, C, D]
        queue:
          type: string
          enum: [triage, care]
        status:
          type: string
          enum: [queued, in_review, resolved]
        slaDueAt:
          type: string
          format: date-time
        assigned:
          type: boolean
        assignedToMe:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
    AdminSafetyCaseEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AdminSafetyCaseData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminSafetyCaseListData:
      type: object
      additionalProperties: false
      required: [cases]
      properties:
        cases:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminSafetyCaseData"
    AdminSafetyCaseListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AdminSafetyCaseListData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminSafetyEvidenceInput:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [triage, appeal, legal]
    AdminSafetyEvidenceData:
      type: object
      additionalProperties: false
      required: [caseId, subjectRef, tier, category, surface]
      properties:
        caseId:
          type: string
        subjectRef:
          type: string
        tier:
          type: string
          enum: [A, B, C, D]
        category:
          type: string
          enum: [fraud, harassment, sexual_content, minor_safety, spam, other]
        surface:
          type: string
          enum: [room, doorway, pod, circle, fire, game, profile]
        contextRef:
          type: string
        description:
          type: string
          description: Free text with phone numbers, email addresses and handles automatically redacted.
    AdminSafetyEvidenceEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AdminSafetyEvidenceData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminCareCaseData:
      type: object
      additionalProperties: false
      required:
        [caseId, subjectRef, signal, status, scripts, createdAt, version]
