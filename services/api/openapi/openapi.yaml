  schemas:
    CorrelationId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    RegisterMemberRequest:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        email:
          type: string
          format: email
          maxLength: 254
    Member:
      type: object
      additionalProperties: false
      required: [id, email, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    Metadata:
      type: object
      additionalProperties: false
      required: [correlationId]
      properties:
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
    MemberEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Member"
        meta:
          $ref: "#/components/schemas/Metadata"
    PhoneNumber:
      type: string
      pattern: ^\+[1-9]\d{7,14}$
      description: E.164 phone number.
    OtpRequestInput:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          $ref: "#/components/schemas/PhoneNumber"
    OtpRequestData:
      type: object
      additionalProperties: false
      required: [challengeId, expiresAt]
      properties:
        challengeId:
          type: string
        expiresAt:
          type: string
          format: date-time
    OtpRequestEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/OtpRequestData"
        meta:
          $ref: "#/components/schemas/Metadata"
    OtpVerifyInput:
      type: object
      additionalProperties: false
      required: [phone, code, deviceId]
      properties:
        phone:
          $ref: "#/components/schemas/PhoneNumber"
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^\d{6}$
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    SessionData:
      type: object
      additionalProperties: false
      required:
        [
          sessionId,
          memberId,
          accessToken,
          accessExpiresAt,
          refreshToken,
          refreshExpiresAt,
        ]
      properties:
        sessionId:
          type: string
        memberId:
          type: string
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
    SessionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/SessionData"
        meta:
          $ref: "#/components/schemas/Metadata"
    GhanaCardInput:
      type: object
      additionalProperties: false
      required: [accountId, cardNumber, dateOfBirth]
      properties:
        accountId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        cardNumber:
          type: string
          minLength: 1
          maxLength: 32
        dateOfBirth:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Date of birth as YYYY-MM-DD.
    VerificationCaseData:
      type: object
      additionalProperties: false
      required: [caseId, status]
      properties:
        caseId:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, queued_manual]
    VerificationCaseEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/VerificationCaseData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminVerificationCaseData:
      type: object
      additionalProperties: false
      required: [caseId, subjectRef, reasonCode, submittedAt, version]
      properties:
        caseId:
          type: string
        subjectRef:
          type: string
          description: Stable pseudonymous subject reference; never the account identifier.
        reasonCode:
          type: string
          enum: [provider_outage, provider_uncertain, manual_review]
        submittedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [queued_manual, approved, rejected]
        version:
          type: integer
          format: int64
          minimum: 1
    AdminVerificationCaseEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AdminVerificationCaseData"
        meta:
          $ref: "#/components/schemas/Metadata"
    AdminVerificationQueueData:
      type: object
      additionalProperties: false
      required: [cases]
      properties:
        cases:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminVerificationCaseData"
    AdminVerificationQueueEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AdminVerificationQueueData"
        meta:
          $ref: "#/components/schemas/Metadata"
    EvidenceAccessInput:
      type: object
      additionalProperties: false
      required: [purpose, reason]
      properties:
        purpose:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_.-]{2,63}$
        reason:
          type: string
          minLength: 8
          maxLength: 240
    VerificationEvidenceData:
      type: object
      additionalProperties: false
      required: [caseId, maskedCard, ageBand, providerStatus]
      properties:
        caseId:
          type: string
        maskedCard:
          type: string
          description: Only the final four card characters are visible.
        ageBand:
          type: string
          enum: [under_18, 18_24, 25_34, 35_49, 50_plus]
        providerStatus:
          type: string
          enum: [provider_outage, provider_uncertain, manual_review]
    VerificationEvidenceEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/VerificationEvidenceData"
        meta:
          $ref: "#/components/schemas/Metadata"
    VerificationDecisionInput:
      type: object
      additionalProperties: false
      required: [outcome, reason, expectedVersion]
      properties:
        outcome:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          minLength: 8
          maxLength: 240
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
    VerificationDecisionData:
      type: object
      additionalProperties: false
      required: [case, outcome, replayed]
      properties:
        case:
          $ref: "#/components/schemas/AdminVerificationCaseData"
        outcome:
          type: string
          enum: [approve, reject]
        replayed:
          type: boolean
    VerificationDecisionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/VerificationDecisionData"
        meta:
          $ref: "#/components/schemas/Metadata"
    PrivacyRequestInput:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    PrivacyRequestData:
      type: object
      additionalProperties: false
      required: [requestId, kind, status, dueAt]
      properties:
        requestId:
          type: string
        kind:
          type: string
          enum: [export, deletion]
        status:
          type: string
          enum: [requested, processing, completed, blocked_legal_hold]
        dueAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    PrivacyRequestEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/PrivacyRequestData"
        meta:
          $ref: "#/components/schemas/Metadata"
    TrustPathReason:
      type: string
      enum:
        - shared_circle
        - vouched_connection
        - known_connection
        - host_connection
    TrustPathStep:
      type: object
      additionalProperties: false
      required: [sourceId, targetId, reason]
      properties:
        sourceId:
          type: string
        targetId:
          type: string
        reason:
          $ref: "#/components/schemas/TrustPathReason"
    TrustPath:
      type: object
      additionalProperties: false
      required: [targetId, hops, steps]
      properties:
        targetId:
          type: string
        hops:
          type: integer
          minimum: 1
          maximum: 4
        steps:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/TrustPathStep"
    TrustPathsData:
      type: object
      additionalProperties: false
      required: [paths]
      properties:
        paths:
          type: array
          maxItems: 99
          items:
            $ref: "#/components/schemas/TrustPath"
    TrustPathsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/TrustPathsData"
        meta:
          $ref: "#/components/schemas/Metadata"
    HeartbeatRange:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: number
          minimum: 0
        end:
          type: number
          exclusiveMinimum: 0
    HeartbeatsInput:
      type: object
      additionalProperties: false
      required: [listenerId, voiceAssetId, assetDuration, ranges]
      properties:
        listenerId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        voiceAssetId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
        assetDuration:
          type: number
          exclusiveMinimum: 0
          maximum: 3600
        ranges:
          type: array
