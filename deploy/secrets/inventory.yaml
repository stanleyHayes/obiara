version: 1
policy:
  production_status: blocked
  metadata_time_format: RFC3339
  future_clock_skew_minutes: 5
secrets:
  - name: MONGODB_URI
    classification: C5
    purpose: least-privilege MongoDB service identity
    services: [api, worker]
    isolation: independent value per service and environment
    owner: platform
    custodian: security
    rotated_at_variable: MONGODB_URI_ROTATED_AT
    maximum_age_days: 90
    overlap_minutes: 30
    reload: rolling service restart
    revoke: revoke old database user after readiness and rollback window
    evidence: secret-store version reference and redacted deployment audit
  - name: RESEND_WEBHOOK_SECRET
    classification: C5
    purpose: verify transactional email delivery webhooks
    services: [api]
    isolation: independent value per environment
    owner: notifications
    custodian: security
    rotated_at_variable: RESEND_WEBHOOK_SECRET_ROTATED_AT
    maximum_age_days: 90
    overlap_minutes: 15
    reload: rolling API restart after provider overlap is active
    revoke: retire old provider signing secret after signed canary and rollback window
    evidence: secret-store version reference and redacted webhook verification audit
  - name: LIVENESS_HMAC_SECRET
    classification: C5
    purpose: key privacy proofs and encrypt temporary liveness captures
    services: [api]
    isolation: independent value per environment
    owner: identity
    custodian: security
    rotated_at_variable: LIVENESS_HMAC_SECRET_ROTATED_AT
    maximum_age_days: 90
    overlap_minutes: 30
    reload: rolling API restart after the replacement key is available
    revoke: retire the old key after all temporary artifacts expire and the rollback window closes
    evidence: secret-store version reference and redacted deployment audit
  - name: COMMERCE_HMAC_SECRET
    classification: C5
    purpose: derive scoped privacy keys for commerce member records
    services: [api]
    isolation: independent value per environment
    owner: commerce
    custodian: security
    rotated_at_variable: COMMERCE_HMAC_SECRET_ROTATED_AT
    maximum_age_days: 90
    overlap_minutes: 30
    reload: rolling API restart after the replacement key is available
    revoke: retire the old key after commerce-key migration and the rollback window
    evidence: secret-store version reference and redacted deployment audit
  - name: ADMIN_HMAC_SECRET
    classification: C5
    purpose: derive opaque subject references for least-privilege admin desks
    services: [api]
    isolation: independent value per environment
    owner: trust-and-safety
    custodian: security
    rotated_at_variable: ADMIN_HMAC_SECRET_ROTATED_AT
    maximum_age_days: 90
    overlap_minutes: 30
    reload: rolling API restart after the replacement key is available
    revoke: retire the old key after admin subject-reference migration and the rollback window
    evidence: secret-store version reference and redacted deployment audit
  - name: NNOBOA_INVITE_SECRET
    classification: C5
    purpose: sign private Nnoboa kin consent and decline invitations
    services: [api]
    isolation: independent value per environment
    owner: identity
    custodian: security
    rotated_at_variable: NNOBOA_INVITE_SECRET_ROTATED_AT
    maximum_age_days: 90
    overlap_minutes: 30
    reload: rolling API restart after the replacement key is available
    revoke: retire the old key after the longest outstanding invitation expires
    evidence: secret-store version reference and redacted deployment audit
  - name: SEED_HMAC_SECRET
    classification: C5
    purpose: derive private seed-owner and seed-record projection keys
    services: [api]
    isolation: independent value per environment
    owner: matching
    custodian: security
    rotated_at_variable: SEED_HMAC_SECRET_ROTATED_AT
    maximum_age_days: 90
    overlap_minutes: 30
    reload: rolling API restart after the replacement key is available
    revoke: retire the old key after seed projection migration and rollback window
    evidence: secret-store version reference and redacted deployment audit
  - name: CIRCLE_HMAC_SECRET
    classification: C5
    purpose: derive private circle-room actor keys and sign circle invitation tokens
    services: [api]
    isolation: independent value per environment
    owner: community
    custodian: security
    rotated_at_variable: CIRCLE_HMAC_SECRET_ROTATED_AT
    maximum_age_days: 90
    overlap_minutes: 30
    reload: rolling API restart after the replacement key is available
    revoke: retire the old key after the longest circle invitation and room retention window
    evidence: secret-store version reference and redacted deployment audit
