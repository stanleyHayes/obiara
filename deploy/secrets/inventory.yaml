version: 1
policy:
  production_status: blocked
  metadata_time_format: RFC3339
  future_clock_skew_minutes: 5
secrets:
  - name: MONGODB_URI
    classification: C5
    purpose: least-privilege MongoDB service identity
    services: [api, worker]
    isolation: independent value per service and environment
    owner: platform
    custodian: security
    rotated_at_variable: MONGODB_URI_ROTATED_AT
    maximum_age_days: 90
    overlap_minutes: 30
    reload: rolling service restart
    revoke: revoke old database user after readiness and rollback window
    evidence: secret-store version reference and redacted deployment audit
  - name: RESEND_WEBHOOK_SECRET
    classification: C5
    purpose: verify transactional email delivery webhooks
    services: [api]
    isolation: independent value per environment
    owner: notifications
    custodian: security
    rotated_at_variable: RESEND_WEBHOOK_SECRET_ROTATED_AT
    maximum_age_days: 90
    overlap_minutes: 15
    reload: rolling API restart after provider overlap is active
    revoke: retire old provider signing secret after signed canary and rollback window
    evidence: secret-store version reference and redacted webhook verification audit
