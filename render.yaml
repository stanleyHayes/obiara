# yaml-language-server: $schema=https://json.schemastore.org/render.json
previews:
  generation: manual
  expireAfterDays: 7

projects:
  - name: obiara
    environments:
      - name: production
        networking:
          isolation: enabled
        permissions:
          protection: enabled
        envVarGroups:
          - name: obiara-production-runtime
            envVars:
              - key: APP_ENV
                value: production
              # Atlas can take well over ten seconds to accept the first
              # connection on a cold or shared cluster. Both services fail
              # startup when this budget is exceeded, which on Render is a
              # crash loop, so the default is generous rather than tight.
              - key: MONGO_CONNECT_TIMEOUT
                value: 30s
              - key: SHUTDOWN_TIMEOUT
                value: 20s
              - key: OTEL_EXPORTER_OTLP_INSECURE
                value: "false"
              - key: FEATURE_SOW_ENABLED
                value: "true"
              - key: FEATURE_FIRES_ENABLED
                value: "true"
              - key: FEATURE_PAYMENTS_ENABLED
                value: "false"
              - key: FEATURE_GATE_ENABLED
                value: "true"
              - key: FEATURE_AI_ENABLED
                value: "false"
              # ---------------------------------------------------------
              # PROVIDER SELECTION (non-secret; safe to keep in the repo)
              #
              # The API validates every one of these at startup and REFUSES
              # TO BOOT if any is left on "simulator" outside development.
              # Simulators report success while doing nothing, which is what
              # let sign-ups accept members who never received an OTP and
              # would have let every identity check auto-approve.
              # ---------------------------------------------------------
              # OTP delivery ladder, tried in order. e.g. "arkesel,twilio".
              - key: OTP_PROVIDERS
                value: arkesel
              # Transactional email. Admin sign-in codes ride this channel,
              # so "simulator" here locks every operator out of the console.
              - key: EMAIL_PROVIDER
                value: resend
              # "disabled" fails WhatsApp sends loudly and delivery-logs
              # them. Switch to "meta" once the Cloud API is provisioned.
              - key: WHATSAPP_PROVIDER
                value: disabled
              # "manual" routes every Ghana Card case to the admin review
              # desk. There is no automated vendor contracted, and the
              # alternative auto-approved fabricated cards and promoted the
              # account a tier.
              - key: IDENTITY_VERIFICATION_PROVIDER
                value: manual
              # "manual" routes every liveness attempt to human review.
              - key: LIVENESS_PROVIDER
                value: manual
              # The weekly seed allowance. Non-purchasable and
              # server-authoritative; this is the main lever on how much
              # reaching-out the platform permits, so review it before
              # sowing is switched on.
              - key: SEED_WEEKLY_ALLOWANCE
                value: "3"
              - key: SEED_WEEK_TIMEZONE
                value: Africa/Accra
              # Device push. "expo" delivers through exp.host; "disabled"
              # fails every push loudly so the ladder falls through to the
              # in-app inbox, which always works.
              - key: PUSH_PROVIDER
                value: expo
        services:
          - name: obiara-api-production
            type: web
            runtime: go
            region: frankfurt
            plan: starter
            buildCommand: go build -trimpath -ldflags="-s -w" -o bin/obiara-api ./services/api
            startCommand: SERVICE_VERSION="${RENDER_GIT_COMMIT:?missing commit}" ./bin/obiara-api
            healthCheckPath: /live
            autoDeployTrigger: checksPass
            numInstances: 1
            buildFilter:
              paths:
                - go.mod
                - go.sum
                - internal/**
                - services/api/**
            envVars:
              - fromGroup: obiara-production-runtime
              - key: GO_VERSION
                value: 1.26.6
              - key: MONGODB_DATABASE
                value: obiara_production
              - key: MONGODB_URI
                sync: false
              - key: MONGODB_URI_ROTATED_AT
                sync: false
              - key: OTEL_EXPORTER_OTLP_ENDPOINT
                sync: false
              - key: RESEND_WEBHOOK_SECRET
                sync: false
              - key: RESEND_WEBHOOK_SECRET_ROTATED_AT
                sync: false
              - key: LIVENESS_HMAC_SECRET
                sync: false
              - key: LIVENESS_HMAC_SECRET_ROTATED_AT
                sync: false
              - key: COMMERCE_HMAC_SECRET
                sync: false
              - key: COMMERCE_HMAC_SECRET_ROTATED_AT
                sync: false
              - key: ADMIN_HMAC_SECRET
                sync: false
              - key: ADMIN_HMAC_SECRET_ROTATED_AT
                sync: false
              - key: NNOBOA_INVITE_SECRET
                sync: false
              - key: NNOBOA_INVITE_SECRET_ROTATED_AT
                sync: false
              - key: SEED_HMAC_SECRET
                sync: false
              - key: SEED_HMAC_SECRET_ROTATED_AT
                sync: false
              - key: CIRCLE_HMAC_SECRET
                sync: false
              - key: CIRCLE_HMAC_SECRET_ROTATED_AT
                sync: false
              - key: LIVEKIT_API_KEY
                sync: false
              - key: LIVEKIT_API_SECRET
                sync: false
              # --- Arkesel (SMS / OTP) -- REQUIRED, API will not boot without
              # Dashboard: https://sms.arkesel.com  ->  Settings -> API Keys
              - key: ARKESEL_API_KEY
                sync: false
              # Pre-approved alphanumeric sender id, max 11 characters.
              - key: ARKESEL_SENDER_ID
                sync: false
              # Optional. Exactly one %s, replaced by the code. Blank uses
              # the built-in Obiara wording.
              - key: OTP_SMS_TEMPLATE
                sync: false
              # --- Resend (email / admin MFA) -- REQUIRED, API will not boot
              # Dashboard: https://resend.com/api-keys
              - key: RESEND_API_KEY
                sync: false
              # Must be an address on a domain verified in Resend.
              - key: RESEND_FROM_ADDRESS
                sync: false
              # Optional operator reply-to address.
              - key: RESEND_REPLY_TO
                sync: false
              # --- Meta WhatsApp Cloud API -- OPTIONAL
              # Only needed if WHATSAPP_PROVIDER is set to "meta".
              - key: META_WHATSAPP_PHONE_NUMBER_ID
                sync: false
              - key: META_WHATSAPP_ACCESS_TOKEN
                sync: false
              # --- Expo push -- OPTIONAL
              # Only needed when the Expo project enables enhanced security.
              - key: EXPO_ACCESS_TOKEN
                sync: false
              # --- Twilio (secondary SMS) -- OPTIONAL
              # Only needed if OTP_PROVIDERS includes "twilio".
              - key: TWILIO_ACCOUNT_SID
                sync: false
              - key: TWILIO_AUTH_TOKEN
                sync: false
              - key: TWILIO_MESSAGING_SERVICE_SID
                sync: false

          - name: obiara-worker-production
            type: worker
            runtime: go
            region: frankfurt
            plan: starter
            buildCommand: go build -trimpath -ldflags="-s -w" -o bin/obiara-worker ./services/worker
            startCommand: SERVICE_VERSION="${RENDER_GIT_COMMIT:?missing commit}" ./bin/obiara-worker
            autoDeployTrigger: checksPass
            numInstances: 1
            buildFilter:
              paths:
                - go.mod
                - go.sum
                - internal/**
                - services/worker/**
            envVars:
              - fromGroup: obiara-production-runtime
              - key: GO_VERSION
                value: 1.26.6
              - key: MONGODB_DATABASE
                value: obiara_production
              - key: MONGODB_URI
                sync: false
              - key: MONGODB_URI_ROTATED_AT
                sync: false
              - key: OTEL_EXPORTER_OTLP_ENDPOINT
                sync: false
              - key: EXPO_ACCESS_TOKEN
                sync: false
