# yaml-language-server: $schema=https://json.schemastore.org/render.json
previews:
  generation: manual
  expireAfterDays: 7

projects:
  - name: obiara
    environments:
      - name: production
        networking:
          isolation: enabled
        permissions:
          protection: enabled
        envVarGroups:
          - name: obiara-production-runtime
            envVars:
              - key: APP_ENV
                value: production
              - key: MONGO_CONNECT_TIMEOUT
                value: 10s
              - key: SHUTDOWN_TIMEOUT
                value: 20s
              - key: OTEL_EXPORTER_OTLP_INSECURE
                value: "false"
              - key: FEATURE_SOW_ENABLED
                value: "true"
              - key: FEATURE_FIRES_ENABLED
                value: "true"
              - key: FEATURE_PAYMENTS_ENABLED
                value: "false"
              - key: FEATURE_GATE_ENABLED
                value: "true"
              - key: FEATURE_AI_ENABLED
                value: "false"
              # Outbound delivery providers. The API refuses to start in
              # production if any channel is left on the simulator, which is
              # what previously let OTP registration accept sign-ups while
              # silently delivering nothing.
              - key: OTP_PROVIDERS
                value: arkesel
              - key: EMAIL_PROVIDER
                value: resend
              - key: WHATSAPP_PROVIDER
                value: disabled
        services:
          - name: obiara-api-production
            type: web
            runtime: go
            region: frankfurt
            plan: starter
            buildCommand: go build -trimpath -ldflags="-s -w" -o bin/obiara-api ./services/api
            startCommand: SERVICE_VERSION="${RENDER_GIT_COMMIT:?missing commit}" ./bin/obiara-api
            healthCheckPath: /live
            autoDeployTrigger: off
            numInstances: 1
            buildFilter:
              paths:
                - go.mod
                - go.sum
                - internal/**
                - services/api/**
            envVars:
              - fromGroup: obiara-production-runtime
              - key: GO_VERSION
                value: 1.26.6
              - key: MONGODB_DATABASE
                value: obiara_production
              - key: MONGODB_URI
                sync: false
              - key: MONGODB_URI_ROTATED_AT
                sync: false
              - key: OTEL_EXPORTER_OTLP_ENDPOINT
                sync: false
              - key: RESEND_WEBHOOK_SECRET
                sync: false
              - key: RESEND_WEBHOOK_SECRET_ROTATED_AT
                sync: false
              - key: LIVENESS_HMAC_SECRET
                sync: false
              - key: LIVENESS_HMAC_SECRET_ROTATED_AT
                sync: false
              - key: COMMERCE_HMAC_SECRET
                sync: false
              - key: COMMERCE_HMAC_SECRET_ROTATED_AT
                sync: false
              - key: ADMIN_HMAC_SECRET
                sync: false
              - key: ADMIN_HMAC_SECRET_ROTATED_AT
                sync: false
              - key: NNOBOA_INVITE_SECRET
                sync: false
              - key: NNOBOA_INVITE_SECRET_ROTATED_AT
                sync: false
              - key: SEED_HMAC_SECRET
                sync: false
              - key: SEED_HMAC_SECRET_ROTATED_AT
                sync: false
              - key: CIRCLE_HMAC_SECRET
                sync: false
              - key: CIRCLE_HMAC_SECRET_ROTATED_AT
                sync: false
              - key: LIVEKIT_API_KEY
                sync: false
              - key: LIVEKIT_API_SECRET
                sync: false
              - key: ARKESEL_API_KEY
                sync: false
              - key: ARKESEL_SENDER_ID
                sync: false
              - key: RESEND_API_KEY
                sync: false
              - key: RESEND_FROM_ADDRESS
                sync: false
              - key: RESEND_REPLY_TO
                sync: false

          - name: obiara-worker-production
            type: worker
            runtime: go
            region: frankfurt
            plan: starter
            buildCommand: go build -trimpath -ldflags="-s -w" -o bin/obiara-worker ./services/worker
            startCommand: SERVICE_VERSION="${RENDER_GIT_COMMIT:?missing commit}" ./bin/obiara-worker
            autoDeployTrigger: off
            numInstances: 1
            buildFilter:
              paths:
                - go.mod
                - go.sum
                - internal/**
                - services/worker/**
            envVars:
              - fromGroup: obiara-production-runtime
              - key: GO_VERSION
                value: 1.26.6
              - key: MONGODB_DATABASE
                value: obiara_production
              - key: MONGODB_URI
                sync: false
              - key: MONGODB_URI_ROTATED_AT
                sync: false
              - key: OTEL_EXPORTER_OTLP_ENDPOINT
                sync: false
