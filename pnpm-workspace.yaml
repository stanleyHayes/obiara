packages:
  - "apps/*"
  - "packages/*"

overrides:
  "@react-native/metro-config": "0.86.0"
  "brace-expansion": "5.0.9"
  "js-yaml": "4.3.1"
  "minimatch": "10.2.5"
  "nanoid": "3.3.18"
  "postcss": "8.5.23"
  "sharp": "0.35.3"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Documented temporary exception per internal/quality/ci-security-baseline.md:
# GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq (image-size DoS) have no patched
# release (vulnerable <=2.0.2, latest is 2.0.2) and are reachable only through
# metro and Storybook dev tooling, never the production runtime.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

minimumReleaseAgeExclude:
  - "@next/env@16.2.12"
  - "@next/eslint-plugin-next@16.2.12"
  - "@next/swc-darwin-arm64@16.2.12"
  - "@next/swc-darwin-x64@16.2.12"
  - "@next/swc-linux-arm64-gnu@16.2.12"
  - "@next/swc-linux-arm64-musl@16.2.12"
  - "@next/swc-linux-x64-gnu@16.2.12"
  - "@next/swc-linux-x64-musl@16.2.12"
  - "@next/swc-win32-arm64-msvc@16.2.12"
  - "@next/swc-win32-x64-msvc@16.2.12"
  - "@turbo/darwin-64@2.10.7"
  - "@turbo/darwin-arm64@2.10.7"
  - "@turbo/linux-64@2.10.7"
  - "@turbo/linux-arm64@2.10.7"
  - "@turbo/windows-64@2.10.7"
  - "@turbo/windows-arm64@2.10.7"
  - eslint-config-next@16.2.12
  - next@16.2.12
  - turbo@2.10.7
